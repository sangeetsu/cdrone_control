name: fun_speed_profile
description: Midpoint PX4 motion profile between the conservative indoor settings and the faster baseline.

parameters:
  # Linear speeds are in m/s, acceleration in m/s^2, and jerk in m/s^3.
  MPC_XY_CRUISE: 3.0
  MPC_XY_VEL_MAX: 6.0
  MPC_ACC_HOR: 2.0
  MPC_JERK_AUTO: 2.5
  MPC_JERK_MAX: 5.0
  MPC_Z_V_AUTO_UP: 1.8
  MPC_Z_V_AUTO_DN: 1.0
  MPC_Z_VEL_MAX_DN: 1.0
  MPC_LAND_SPEED: 0.5
