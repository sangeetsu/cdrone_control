name: default_speed_profile
description: PX4 motion profile matching the faster baseline values used before the indoor profile.

parameters:
  # Linear speeds are in m/s, acceleration in m/s^2, and jerk in m/s^3.
  MPC_XY_CRUISE: 5.0
  MPC_XY_VEL_MAX: 12.0
  MPC_ACC_HOR: 3.0
  MPC_JERK_AUTO: 4.0
  MPC_JERK_MAX: 8.0
  MPC_Z_V_AUTO_UP: 3.0
  MPC_Z_V_AUTO_DN: 1.5
  MPC_Z_VEL_MAX_DN: 1.5
  MPC_LAND_SPEED: 0.7
