name: ark_flow_px4_1_16_hover
description: ARK Flow over DroneCAN, GPS-denied hover with barometric height reference and conditional range aiding. Operator applies while disarmed, then reboots.
# PX4 1.16: https://docs.px4.io/v1.16/en/dronecan/ark_flow
# No sensor calibration, mounting offsets, or controller gains are included.
# Preserve and physically verify SENS_FLOW_ROT and EKF2_OF/RNG_POS_* separately.
parameters:
  UAVCAN_ENABLE: 2
  UAVCAN_SUB_FLOW: 1
  UAVCAN_SUB_RNG: 1
  EKF2_OF_CTRL: 1
  EKF2_EV_CTRL: 0
  EKF2_GPS_CTRL: 0
  EKF2_BARO_CTRL: 1
  EKF2_HGT_REF: 0
  EKF2_RNG_CTRL: 1
  EKF2_RNG_A_HMAX: 10.0
  EKF2_RNG_QLTY_T: 0.2
  UAVCAN_RNG_MIN: 0.08
  UAVCAN_RNG_MAX: 30.0
  SENS_FLOW_MINHGT: 0.08
  SENS_FLOW_MAXHGT: 25.0
  SENS_FLOW_MAXR: 7.4
  COM_OBL_RC_ACT: 4
  COM_OF_LOSS_T: 1.0
