identity:
  drone_id: cdrone3
  hostname: cdrone3
  drone_namespace: /cdrone/cdrone3
  mavros_namespace: /cdrone/cdrone3/mavros

network:
  local_ip: 192.168.0.194
  peer_drone_ips:
    cdrone4: 192.168.0.121
  optitrack_server: 192.168.0.217
  optitrack_port: 3883

mocap:
  pose_source: optitrack
  mocap_namespace: /cdrone/cdrone3/vrpn_mocap
  rigid_body_name: RigidBody3
  map_frame: map
  # Current OptiTrack map frame is rotated 180 deg from the saved studio map:
  # x_source/y_source must become -x/-y before perimeter and PX4 use it.
  frame_rpy_rad: [0.0, 0.0, 3.141592653589793]
  vrpn_update_freq: 100.0
  vrpn_refresh_freq: 1.0
  vrpn_sensor_data_qos: true
  source_best_effort: true
  use_vrpn_timestamps: false

tracking:
  ownship_pose_topic: /cdrone/cdrone3/external_pose/input_pose
  compare_pose_topic: /cdrone/cdrone3/vrpn_mocap/RigidBody2/pose
