target_follow_controller_node:
  ros__parameters:
    # Keep startup safe. Enable explicitly through the service when ready.
    follow_enabled_on_startup: false

    require_mavros_connected: true
    require_armed: true
    require_offboard: true
    require_companion_active: true

    publish_zero_on_block: true
    publish_zero_on_lost_target: true

    state_timeout_s: 1.0
    local_pose_timeout_s: 0.5
    companion_status_timeout_s: 0.5
    track_timeout_s: 0.5
    track_gc_s: 2.5

    min_track_confidence: 0.35
    max_target_distance_m: 8.0
    require_target_in_front: true
    max_abs_target_y_m: 4.0
    max_abs_target_z_m: 2.5
    min_safe_distance_m: 1.0

    follow_distance_m: 3.0
    follow_distance_tolerance_m: 0.25
    lateral_deadband_m: 0.15
    vertical_deadband_m: 0.15
    yaw_deadband_rad: 0.08

    kp_xy: 0.45
    kp_z: 0.30
    kp_yaw: 0.80
    max_vel_xy_mps: 1.0
    max_vel_z_mps: 0.5
    max_yaw_rate_rps: 0.6
